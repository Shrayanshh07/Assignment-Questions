<!DOCTYPE html>
<html>
<head>
    <title>Form Validation</title>
</head>
<body>

    <form action="submit.php" method="post">

        <input type="text"
               name="name"
               placeholder="Full name"
               required>
        <br><br>

        <input type="email"
               name="email"
               placeholder="you@college.edu"
               required>
        <br><br>

        <input type="tel"
               name="mobile"
               placeholder="10-digit mobile"
               pattern="[0-9]{10}"
               title="Enter exactly 10 digits"
               required>
        <br><br>

        <input type="password"
               name="password"
               placeholder="Min 6 characters"
               minlength="6"
               required>
        <br><br>

        <input type="number"
               name="age"
               placeholder="Age"
               min="17"
               max="30"
               required>
        <br><br>

        <input type="submit" value="Register">

    </form>

</body>
</html>
